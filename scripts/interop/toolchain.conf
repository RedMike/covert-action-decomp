# DOSBox configuration for running the 16-bit DOS toolchain: the interactive
# SETUP /L run and, with SDL_VIDEODRIVER=dummy in the environment, the headless
# tool runs.

[sdl]
fullscreen=false
output=surface
autolock=false
waitonerror=false
priority=highest,highest

[dosbox]
machine=svga_s3
memsize=16
captures=capture

[render]
aspect=false
scaler=none

[cpu]
core=auto
cputype=auto
# The toolchain is not timing-sensitive; run it as fast as the host allows.
cycles=max

[mixer]
nosound=true

[midi]
mpu401=none
mididevice=none

[sblaster]
sbtype=none

[gus]
gus=false

[speaker]
pcspeaker=false

[joystick]
joysticktype=none

[dos]
xms=true
ems=true
umb=true

[ipx]
ipx=false
