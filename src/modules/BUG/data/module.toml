# Module manifest for BUG.EXE.
#
# Two code segments: the driver dispatch segment is linked first, so the
# module's own code and the MSC run-time share the second.

name = "BUG"
output = "BUG.EXE"

target = "MPS/COVERT/BUG.EXE"
packed = true

# A build with a define is medium-model: no 64 KB code ceiling.
mod_model = "medium"

[link]
flags = []
# The MSC 5.1 small-model run-time.
libs = ["SLIBCE.LIB"]
load_libs = []

# Objects, in link order.
[[objects]]
target = "BUG.ASM"
sources = ["BUG.ASM"]
tool = "masm"

[[objects]]
target = "MAIN.C"
sources = [
    "MAIN.C",
    "stubs/HOOK-HAND-BACK.C",
    "shared/MAIN.C",
    "MAIN-2.C",
    "stubs/MAIN.C",
    "MAIN-3.C",
    "stubs/HOOK-REPAINT.C",
]
tool = "cl"
flags = ["/Gs", "/Os", "/Oa", "/Zl"]

# One unit of 36 routines runs through BOARD.C, CASERUN.C and REPORT.C.
[[objects]]
target = "BOARD.C"
sources = [
    "shared/SPRITE-DRAW.C",
    "SPRITE-DRAW.C",
    "SPRITE-LOAD.C",
    "BOARD-LAYOUT.C",
    "BOARD-STEP.C",
    "TRACE.C",
    "TICK.C",
    "KEYS.C",
    "CHIP-DRAW.C",
    "CLOCK.C",
    "shared/ASK-MENU.C",
    "HOOK-MESSAGE.C",
    "SCORE.C",
    "shared/SOUND.C",
]
tool = "cl"
flags = ["/Gs", "/Os", "/Oa", "/Zl"]

[[objects]]
target = "CASERUN.C"
sources = [
    "shared/CASE-STEP.C",
    "shared/CASE-SLOT.C",
]
tool = "cl"
flags = ["/Gs", "/Os", "/Oa", "/Zl"]

[[objects]]
target = "REPORT.C"
sources = [
    "shared/REPORT.C",
    "shared/KEYWAIT.C",
    "shared/SUSPECT.C",
    "shared/LEAD.C",
