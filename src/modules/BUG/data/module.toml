tool = "cl"
flags = ["/Gs", "/Os", "/Oa", "/Zl"]

# One unit: /Ot word-aligns every function and block after a `ret`, and /Ol is
# for c_archive_find's loop.
[[objects]]
target = "ARCHIVE.C"
sources = [
    "shared/MEMORY-REFILL.C",
    "shared/PRIME-FILE.C",
    "shared/FILE-REFILL.C",
    "shared/FATAL-ERROR.C",
