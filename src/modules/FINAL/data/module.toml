# Module manifest for FINAL.EXE: the front end and the frame around a case.

name = "FINAL"
output = "FINAL.EXE"

target = "MPS/COVERT/FINAL.EXE"
packed = true

# A build with a define is medium-model: no 64 KB code ceiling.
mod_model = "medium"

# c_copy_protection emits a real JNE; the linked image gets the two NOPs back.
copyright_patch = true

[link]
flags = []
# The MSC 5.1 small-model run-time.
libs = ["SLIBCE.LIB"]
load_libs = []

