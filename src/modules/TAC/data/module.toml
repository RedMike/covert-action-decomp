# Module manifest for TAC.EXE, the Combat minigame.
#
# Its code segment is 80 bytes short of 64 KB, so every near branch in the last
# 3632 bytes of CODE_1 is recorded one segment out.

name = "TAC"
output = "TAC.EXE"

target = "MPS/COVERT/TAC.EXE"
packed = true

# A build with a define is medium-model: no 64 KB code ceiling.
mod_model = "medium"

[link]
flags = []
# The MSC 5.1 small-model run-time.
libs = ["SLIBCE.LIB"]
load_libs = []

