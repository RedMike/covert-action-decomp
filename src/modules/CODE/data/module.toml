# Module manifest for CODE.EXE, the cryptography minigame.
#
# The driver dispatch segment is linked first, so the module's own code is the
# second block and the MSC run-time sits in its tail.

name = "CODE"
output = "CODE.EXE"

target = "MPS/COVERT/CODE.EXE"
packed = true

# A build with a define is medium-model: no 64 KB code ceiling.
mod_model = "medium"

[link]
flags = []
# The MSC 5.1 small-model run-time.
libs = ["SLIBCE.LIB"]
load_libs = []

# Objects, in link order.
[[objects]]
target = "CODE.ASM"
sources = ["CODE.ASM"]
tool = "masm"

[[objects]]
target = "MAIN.C"
sources = ["MAIN.C"]
tool = "cl"
flags = ["/Gs", "/Os", "/Oa", "/Zl"]

[[objects]]
target = "SETUP.C"
sources = [
    "HOOK-HAND-BACK.C",
    "shared/SOUND.C",
    "shared/PAGE-SHOW.C",
    "stubs/STUBS.C",
    "stubs/HOOK-REPAINT.C",
    "stubs/STUBS-2.C",
]
tool = "cl"
flags = ["/Gs", "/Os", "/Oa", "/Zl"]

# Its routines are one object: no even boundary lies between them.
[[objects]]
