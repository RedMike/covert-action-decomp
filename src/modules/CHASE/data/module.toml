# Module manifest for CHASE.EXE, the car chase minigame.
#
# The driver dispatch segment links first, so the module's code is the second
# block with the MSC run-time at its tail.

name = "CHASE"
output = "CHASE.EXE"

target = "MPS/COVERT/CHASE.EXE"
packed = true

# A build with a define is medium-model: no 64 KB code ceiling.
mod_model = "medium"

[link]
flags = []
# The MSC 5.1 small-model run-time.
libs = ["SLIBCE.LIB"]
load_libs = []

# Objects, in link order: the assembly first, then the C.
[[objects]]
target = "CHASE.ASM"
sources = ["CHASE.ASM"]
tool = "masm"

[[objects]]
target = "MAIN.C"
sources = [
    "MAIN.C",
]
tool = "cl"
